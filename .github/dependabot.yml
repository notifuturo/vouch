version: 2
updates:
  # We pin payment-critical deps EXACT, so Dependabot's job is to ALERT us when
  # a new version (or a security fix) is available — we then bump deliberately
  # and re-run the audit/tests, rather than letting ranges float.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies

  # Keep the GitHub Actions (pinned by SHA) current + patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
