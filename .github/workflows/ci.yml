name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. It never needs write access, and a
# read-only GITHUB_TOKEN limits the blast radius of a compromised action.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety): a hijacked
      # tag can't silently change what runs. Comments note the human version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on a known HIGH/CRITICAL vuln in shipped (prod) deps.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
