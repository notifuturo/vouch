name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. It never needs write access, and a
# read-only GITHUB_TOKEN limits the blast radius of a compromised action.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety): a hijacked
      # tag can't silently change what runs. Comments note the human version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail the build on a known HIGH/CRITICAL vuln in shipped (prod) deps.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
