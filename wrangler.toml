# Cloudflare Workers config for Vouch.
# Free tier: 100k requests/day. No server to manage.
name = "vouch"
main = "src/index.ts"
compatibility_date = "2026-01-09"
compatibility_flags = ["nodejs_compat"]

# Reputation store — Cloudflare D1 (free tier SQLite).
# Create with: wrangler d1 create vouch  (then paste the database_id below)
[[d1_databases]]
binding = "DB"
database_name = "vouch"
database_id = "9f09e97e-4174-461f-87de-5b0ca42a1174"

[vars]
# x402 settings. Testnet first ($0). Switch NETWORK to "base" for mainnet.
X402_NETWORK = "base"
X402_FACILITATOR_URL = "https://x402.org/facilitator"
# Price per /v1/check. Set above the CDP facilitator fee ($0.001/settle after the
# first 1,000/month) to keep margin. $0.01 = ~90% margin; tune freely.
PRICE_CHECK_USDC = "0.01"
# Free threat feed for the `threat_feed` signal. URLhaus hosts-file format
# ("127.0.0.1<TAB>host", '#' comment lines). Parsed to bare hosts, cached, fails open.
THREAT_FEED_URL = "https://urlhaus.abuse.ch/downloads/hostfile/"
# PAY_TO_ADDRESS receives x402 payments. This is a PUBLIC address (safe to
# commit); the matching private key is never stored here. This is the
# owner-confirmed Base MAINNET self-custody payout wallet — do NOT change it
# without confirming the new address and that its private key is securely held.
PAY_TO_ADDRESS = "0xe126002451d0187058cD03719bBCc0bd1CD9c5c9"

# Agnic monetization registry headers (X-Merchant-* on every response).
# OPTIONAL: emitted only when set. Fill these in AFTER creating an Agnic
# merchant account at app.agnic.ai/monetize, then redeploy — no code change.
# AGNIC_MERCHANT_ID = ""        # merchant id issued by Agnic
# AGNIC_MERCHANT_WALLET = ""    # USDC payout address
# AGNIC_FEE_PERCENT = ""        # our margin, e.g. "2.5"

# Rate limiter for the free POST /v1/report endpoint (anti-poisoning abuse).
# 10 reports per 60s per client IP. No-ops gracefully if unbound (local/tests).
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Rate limiter for the free POST /v1/score tier (more generous than report).
# 60 free scores per 60s per client IP. Paid /v1/check is unthrottled.
[[ratelimits]]
name = "SCORE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60
